name: Deploy ROAD to GitHub Pages
on:
  # Automatic public deployments are frozen until server-side access control is configured.
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble ROAD app
        run: |
          mkdir -p site
          cp index.html manifest.webmanifest service-worker.js site/
          mkdir -p site/js site/assets
          cp -R js/. site/js/
          cp -R assets/. site/assets/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
